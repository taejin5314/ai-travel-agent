# Preview screenshots — posts Vercel preview screenshots on UI PRs.
#
# So a PR can be reviewed entirely from a phone: when a PR touches UI files,
# this waits for the Vercel preview deployment, captures mobile + desktop
# full-page screenshots with Playwright, publishes the images to the orphan
# `screenshots` branch, and keeps ONE sticky comment on the PR up to date.
#
# Safety: never deploys, never touches main, no app secrets. The optional
# VERCEL_AUTOMATION_BYPASS_SECRET is only appended to the preview URL if
# Vercel Deployment Protection is enabled.
name: Preview Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "public/**"
      - "**/*.css"

permissions:
  contents: write        # push images to the `screenshots` branch only
  deployments: read      # find the Vercel preview URL
  pull-requests: write   # sticky screenshot comment

concurrency:
  group: preview-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Vercel preview
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo, sha, per_page: 10,
              });
              for (const d of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  ...context.repo, deployment_id: d.id, per_page: 10,
                });
                const success = statuses.find((s) => s.state === "success" && s.environment_url);
                if (success) {
                  core.setOutput("url", success.environment_url);
                  core.info(`Preview ready: ${success.environment_url}`);
                  return;
                }
                if (statuses.some((s) => s.state === "failure" || s.state === "error")) {
                  core.setFailed("Vercel preview deployment failed — nothing to screenshot.");
                  return;
                }
              }
              core.info("Preview not ready yet, retrying in 15s…");
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed("Timed out after 10 minutes waiting for the Vercel preview.");

      - name: Capture screenshots
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          URL="$PREVIEW_URL"
          # If Vercel Deployment Protection is on, bypass it for this bot only.
          if [ -n "$BYPASS" ]; then
            URL="${URL}?x-vercel-protection-bypass=${BYPASS}&x-vercel-set-bypass-cookie=true"
          fi
          npx -y playwright@1.50.1 install --with-deps chromium
          npx -y playwright@1.50.1 screenshot --browser=chromium --full-page \
            --viewport-size=390,844 --wait-for-timeout=4000 "$URL" mobile.png
          npx -y playwright@1.50.1 screenshot --browser=chromium --full-page \
            --viewport-size=1440,900 --wait-for-timeout=4000 "$URL" desktop.png

      - name: Publish images to screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SHA7="${HEAD_SHA:0:7}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch screenshots "$REMOTE" shots 2>/dev/null; then
            cd shots
          else
            mkdir shots && cd shots
            git init -q -b screenshots
            git remote add origin "$REMOTE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEST="pr-${PR_NUMBER}/${SHA7}"
          mkdir -p "$DEST"
          cp ../mobile.png ../desktop.png "$DEST/"
          git add "$DEST"
          git commit -q -m "screenshots: PR #${PR_NUMBER} @ ${SHA7}"
          git push -q origin screenshots

      - name: Post sticky PR comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha7 = pr.head.sha.slice(0, 7);
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/screenshots/pr-${pr.number}/${sha7}`;
            const marker = "<!-- preview-screenshots -->";
            const body = [
              marker,
              `### 📸 Preview screenshots — \`${sha7}\``,
              "",
              `Preview: ${process.env.PREVIEW_URL}`,
              "",
              "| Mobile 390×844 | Desktop 1440×900 |",
              "| --- | --- |",
              `| <img src="${base}/mobile.png" width="280" alt="mobile preview"> | <img src="${base}/desktop.png" width="520" alt="desktop preview"> |`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body,
              });
            }
